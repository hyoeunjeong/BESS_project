<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BESS 실시간 모니터링</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto 1fr 1fr;
            height: 100vh;
            gap: 15px;
            padding: 15px;
        }

        /* 헤더 */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px 20px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 700;
        }

        .header .time {
            font-size: 1.2em;
            color: #94a3b8;
        }

        .header .status {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 카드 */
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 150px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #475569;
            background: rgba(30, 41, 59, 0.9);
        }

        .card.charging {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .card.discharging {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        /* 메트릭 */
        .metric {
            text-align: center;
        }

        .metric-value {
            font-size: 2.8em;
            font-weight: bold;
            margin: 10px 0;
            line-height: 1;
        }

        .metric-label {
            font-size: 1em;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .metric-unit {
            font-size: 0.9em;
            color: #64748b;
        }

        /* 색상 */
        .text-positive { color: #10b981; }
        .text-negative { color: #ef4444; }
        .text-warning { color: #f59e0b; }
        .text-info { color: #3b82f6; }

        /* 게이지 */
        .gauge-container {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .gauge {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #10b981 0deg 90deg,
                #f59e0b 90deg 270deg,
                #ef4444 270deg 360deg
            );
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .gauge-inner {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .gauge-value {
            font-size: 2.2em;
            font-weight: bold;
        }

        .gauge-percent {
            font-size: 0.9em;
            color: #94a3b8;
        }

        /* 차트 영역 */
        .chart-area {
            grid-column: 1 / -1;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .chart-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #e2e8f0;
        }

        .chart-container {
            position: relative;
            flex: 1;
            min-height: 250px;
        }

        /* 반응형 */
        @media (max-width: 1400px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
                gap: 10px;
                padding: 10px;
            }

            .header {
                padding: 10px 15px;
            }

            .header h1 {
                font-size: 1.4em;
            }

            .card {
                min-height: 120px;
                padding: 15px;
            }

            .metric-value {
                font-size: 2em;
            }

            .gauge {
                width: 120px;
                height: 120px;
            }

            .gauge-inner {
                width: 110px;
                height: 110px;
            }

            .gauge-value {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <h1> BESS 실시간 모니터링</h1>
            <div class="status">
                <span class="time" id="current-time">--:--:--</span>
                <span class="status-indicator"></span>
            </div>
        </div>

        <!-- SOC (배터리 상태) -->
        <div class="card">
            <div class="metric-label">배터리 상태</div>
            <div class="gauge-container">
                <div class="gauge">
                    <div class="gauge-inner">
                        <div class="gauge-value" id="soc-value">--</div>
                        <div class="gauge-percent">%</div>
                    </div>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 0.9em; color: #94a3b8;">
                <div>최대: <span id="soc-max">90</span>%</div>
                <div>최소: <span id="soc-min">10</span>%</div>
            </div>
        </div>

        <!-- BESS 파워 -->
        <div class="card" id="bess-card">
            <div class="metric-label">BESS 출력</div>
            <div class="metric">
                <div class="metric-value" id="bess-power">0.0</div>
                <div class="metric-unit">kW</div>
                <div style="margin-top: 8px; font-size: 0.85em; color: #94a3b8;">
                    <div id="bess-action">대기</div>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 0.85em;">
                <div>충전: <span class="text-info" id="bess-charge">0.0</span> kW</div>
                <div>방전: <span class="text-positive" id="bess-discharge">0.0</span> kW</div>
            </div>
        </div>

        <!-- 요금 정보 -->
        <div class="card">
            <div class="metric-label">현재 요금</div>
            <div class="metric">
                <div class="metric-value" id="tariff-rate">-</div>
                <div class="metric-unit">원/kWh</div>
                <div style="margin-top: 8px; font-size: 0.85em; color: #94a3b8;">
                    <div id="tariff-period">-</div>
                </div>
            </div>
        </div>

        <!-- 부하 정보 -->
        <div class="card">
            <div class="metric-label">시스템 부하</div>
            <div class="metric">
                <div class="metric-value" id="load-kw">0.0</div>
                <div class="metric-unit">kW</div>
                <div style="margin-top: 8px; font-size: 0.85em;">
                    <div>태양광: <span class="text-warning" id="solar-kw">0.0</span> kW</div>
                </div>
            </div>
        </div>

        <!-- 계통 전력 -->
        <div class="card">
            <div class="metric-label">계통 전력</div>
            <div class="metric">
                <div class="metric-value" id="grid-power">0.0</div>
                <div class="metric-unit">kW</div>
                <div style="margin-top: 8px; font-size: 0.85em; color: #94a3b8;">
                    <div id="grid-status">-</div>
                </div>
            </div>
        </div>

        <!-- 차트 -->
        <div class="chart-area">
            <div class="chart-title">실시간 전력 흐름 (최근 24시간)</div>
            <div class="chart-container">
                <canvas id="powerChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let chart = null;

        // 시간 업데이트
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = 
                now.toLocaleTimeString('ko-KR');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // WebSocket 연결 — 실시간 상태 업데이트
        socket.on('status_update', (data) => {
            updateMetrics(data);
        });

        // REST API에서도 데이터 받기 (폴백)
        setInterval(() => {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => updateMetrics(data))
                .catch(e => console.log('API 오류:', e));
        }, 1000);

        // 메트릭 업데이트
        function updateMetrics(data) {
            if (!data) return;

            // SOC
            const soc = parseFloat(data.soc || 0).toFixed(1);
            document.getElementById('soc-value').textContent = soc;

            // BESS 파워
            const bessPower = parseFloat(data.bess_power_kw || 0).toFixed(1);
            const bessCard = document.getElementById('bess-card');
            document.getElementById('bess-power').textContent = bessPower;
            
            // 충방전 상태 색상
            bessCard.classList.remove('charging', 'discharging');
            if (bessPower < -1) {
                bessCard.classList.add('charging');
                document.getElementById('bess-action').textContent = '⚡ 충전 중';
                document.getElementById('bess-action').className = 'text-info';
            } else if (bessPower > 1) {
                bessCard.classList.add('discharging');
                document.getElementById('bess-action').textContent = '📤 방전 중';
                document.getElementById('bess-action').className = 'text-positive';
            } else {
                document.getElementById('bess-action').textContent = '⏸ 대기';
                document.getElementById('bess-action').className = '';
            }

            document.getElementById('bess-charge').textContent = 
                parseFloat(data.charge_kw || 0).toFixed(1);
            document.getElementById('bess-discharge').textContent = 
                parseFloat(data.discharge_kw || 0).toFixed(1);

            // 요금
            document.getElementById('tariff-rate').textContent = 
                parseInt(data.tariff_rate || 0);

            // 부하/태양광
            document.getElementById('load-kw').textContent = 
                parseFloat(data.load_kw || 0).toFixed(1);
            document.getElementById('solar-kw').textContent = 
                parseFloat(data.solar_kw || 0).toFixed(1);

            // 계통
            const gridPower = parseFloat(data.grid_power_kw || 0).toFixed(1);
            document.getElementById('grid-power').textContent = gridPower;
            const gridStatus = gridPower < 0 ? 
                `📤 역송전 ${Math.abs(gridPower)} kW` : 
                `📥 구매 ${gridPower} kW`;
            document.getElementById('grid-status').textContent = gridStatus;
        }

        // 차트 초기화 및 업데이트
        function initChart() {
            const ctx = document.getElementById('powerChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '부하 (Load)',
                            data: [],
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                        },
                        {
                            label: '태양광 (Solar)',
                            data: [],
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                        },
                        {
                            label: 'BESS (Battery)',
                            data: [],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                        },
                        {
                            label: '계통 (Grid)',
                            data: [],
                            borderColor: '#8b5cf6',
                            backgroundColor: 'rgba(139, 92, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                        },
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(51, 65, 85, 0.3)' },
                            ticks: { color: '#94a3b8' },
                            title: { display: true, text: 'Power (kW)', color: '#94a3b8' }
                        },
                        x: {
                            grid: { color: 'rgba(51, 65, 85, 0.3)' },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#e2e8f0', padding: 15 }
                        }
                    }
                }
            });
        }

        function updateChart() {
            if (!chart) {
                initChart();
            }
            // 차트는 5초마다 전체 데이터 갱신
            if (Math.random() > 0.8) {
                fetch('/api/history?hours=24')
                    .then(r => r.json())
                    .then(response => {
                        const data = response.data || [];
                        if (data.length === 0) return;
                        
                        chart.data.labels = data.map(d => new Date(d.timestamp).toLocaleTimeString('ko-KR', {hour: '2-digit', minute:'2-digit'}));
                        chart.data.datasets[0].data = data.map(d => d.load_kw);
                        chart.data.datasets[1].data = data.map(d => d.solar_kw);
                        chart.data.datasets[2].data = data.map(d => d.bess_power_kw);
                        chart.data.datasets[3].data = data.map(d => d.grid_power_kw);
                        chart.update('none');
                    });
            }
        }

        // 초기 데이터 로드
        window.addEventListener('load', () => {
            fetch('/api/status').then(r => r.json()).then(updateMetrics);
            initChart();
            setInterval(updateChart, 5000);
        });
    </script>
</body>
</html>
